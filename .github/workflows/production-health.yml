name: Production Health

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [render_deploy]

permissions:
  contents: read

jobs:
  health-check:
    name: Validate production health contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch release metadata
        id: release
        shell: bash
        env:
          HEALTH_URL: https://eu-funds-and-grants-ai.onrender.com/health
        run: |
          set -euo pipefail

          output="health.json"
          status_code=""
          max_attempts=30
          attempt=1
          sleep_seconds=10

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "[WAIT] Attempt $attempt/$max_attempts -> $HEALTH_URL"

            if status_code=$(curl -sS -o "$output" -w "%{http_code}" "$HEALTH_URL"); then
              echo "HTTP status: $status_code"
            else
              echo "[WAIT] curl failed; retrying."
            fi

            if [ "$status_code" = "200" ] && [ -s "$output" ]; then
              echo "[PASS] Health endpoint responded successfully."

              python - "$output" <<'PY'
          from pathlib import Path
          import json
          import os
          import sys

          path = Path(sys.argv[1])

          try:
              payload = json.loads(
                  path.read_text(encoding="utf-8")
              )
          except Exception as exc:
              print(f"[WAIT] Invalid health JSON: {exc}")
              raise SystemExit(1)

          expected_sha = os.environ["EXPECTED_SHA"]
          expected_version = os.environ["EXPECTED_VERSION"]
          expected_collection = os.environ[
              "EXPECTED_COLLECTION"
          ]
          expected_documents = int(
              os.environ["EXPECTED_DOCUMENTS"]
          )

          expected = {
              "status": "healthy",
              "version": expected_version,
              "git_commit": expected_sha,
              "chroma_collection": expected_collection,
              "chroma_documents": expected_documents,
              "database": "connected",
              "ai_engine": "ready",
              "grants_total": 30,
              "grants_in_vector_db": 30,
          }

          failures = []

          for key, value in expected.items():
              actual = payload.get(key)
              passed = actual == value

              print(
                  f"{key}="
                  f"{'PASS' if passed else 'WAIT'}"
              )

              if not passed:
                  failures.append(
                      f"{key}: expected={value!r}, "
                      f"actual={actual!r}"
                  )

          if failures:
              print("[WAIT] Production is not current:")

              for failure in failures:
                  print(f"  {failure}")

              raise SystemExit(1)

          print("[PASS] production health contract")
          PY
              then
                cp "$output" production-health.json
                break
              fi
            else
              echo "[WAIT] Health request failed."
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "[FAIL] Production did not reach expected release."
              exit 1
            fi

            attempt="$((attempt + 1))"
            sleep "$sleep_seconds"
          done

      - name: Publish health summary
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.expected_sha }}
        run: |
          set -euo pipefail

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import json
          import os

          payload = json.loads(
              Path("production-health.json").read_text(
                  encoding="utf-8"
              )
          )

          print("# Production health")
          print()
          print(f"- Status: `{payload['status']}`")
          print(f"- Version: `{payload['version']}`")
          print(f"- Git commit: `{payload['git_commit']}`")
          print(
              "- Chroma collection: "
              f"`{payload['chroma_collection']}`"
          )
          print(
              "- Chroma documents: "
              f"`{payload['chroma_documents']}`"
          )
          print(
              "- Grants loaded: "
              f"`{payload['grants_total']}`"
          )
          print(
              "- AI engine: "
              f"`{payload['ai_engine']}`"
          )
          print()
          print(
              "Expected commit: "
              f"`{os.environ['EXPECTED_SHA']}`"
          )
          PY

      - name: Upload health response
        uses: actions/upload-artifact@v7
        with:
          name: production-health
          path: production-health.json
          retention-days: 7
